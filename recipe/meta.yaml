{% set name = "networkx" %}
{% set version = "3.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: fd77a511bd90f39f3d016351345b52cf5319b813bdca01de3f755d3cca62e96a

build:
  number: 0
  skip: true  # [py<312]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python
  run_constrained:
    # default
    - numpy >=2.2
    - scipy >=1.15
    - matplotlib-base >=3.10
    - pandas >=2.3
    # example
    - osmnx >=2.0.0
    - momepy >=0.7.2
    - contextily >=1.6
    - seaborn >=0.13
    - cairocffi >=1.7
    - igraph >=0.11
    - scikit-learn >=1.6
    # extra
    - lxml >=4.6
    - pygraphviz >=2.0
    - pydot >=3.0.1
    - sympy >=1.10
    - iplotx >=0.9.0
    - python-build >=0.10
    - twine >=4.0
    - wheel >=0.40
    - changelist ==0.5
    - hiveplotlib >=0.28

test:
  imports:
    - networkx
    - networkx.algorithms
    - networkx.algorithms.approximation
    - networkx.algorithms.assortativity
    - networkx.algorithms.bipartite
    - networkx.algorithms.centrality
    - networkx.algorithms.coloring
    - networkx.algorithms.community
    - networkx.algorithms.components
    - networkx.algorithms.connectivity
    - networkx.algorithms.flow
    - networkx.algorithms.isomorphism
    - networkx.algorithms.link_analysis
    - networkx.algorithms.minors
    - networkx.algorithms.operators
    - networkx.algorithms.shortest_paths
    - networkx.algorithms.traversal
    - networkx.algorithms.tree
    - networkx.classes
    - networkx.drawing
    - networkx.generators
    - networkx.linalg
    - networkx.readwrite
    - networkx.readwrite.json_graph
    - networkx.utils
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -v --pyargs networkx

about:
  home: https://networkx.org
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  summary: Python package for creating and manipulating complex networks
  description: |
    NetworkX is a Python language software package for the creation,
    manipulation, and study of the structure, dynamics, and functions of complex
    networks.
  doc_url: https://networkx.org/documentation/stable
  dev_url: https://github.com/networkx/networkx

extra:
  skip-lints:
    - invalid_url  # it is common URL ...
  recipe-maintainers:
    - synapticarbors
    - ocefpaf
    - SylvainCorlay
    - FelixMoelder
